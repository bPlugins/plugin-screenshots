<!DOCTYPE html>
<html lang='en'>

<head>
	<meta charset='UTF-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1.0'>
	<title>Super Video Player</title>
	<link rel='stylesheet' href='global.css' />
</head>

<body>
	<div class='wrapper'>
		<button class='downloadBtn'>
			Download Images
		</button>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Admin Dashboard</h2>

				<div class='images'>
					<img src='images/super-video-player/admin-dashboard.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Add New Item (ShortCode)</h2>

				<div class='images'>
					<img src='images/super-video-player/add-new-item-shortcode.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Configuration</h2>

				<div class='images'>
					<img src='images/super-video-player/configuration-shortcode.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Preview</h2>

				<div class='images'>
					<img src='images/super-video-player/preview.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Preview Playlist</h2>

				<div class='images'>
					<img src='images/super-video-player/preview-playlist-default.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Preview Playlist - Horizontal</h2>

				<div class='images'>
					<img src='images/super-video-player/preview-playlist-horizontal.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Preview Playlist - Vertical</h2>

				<div class='images'>
					<img src='images/super-video-player/preview-playlist-vertical.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Preview Playlist - Grid</h2>

				<div class='images'>
					<img src='images/super-video-player/preview-playlist-grid.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Gutenberg Block</h2>

				<div class='images'>
					<img src='images/super-video-player/gutenberg-block.png' />
				</div>
			</div>
		</div>

		<div class='canvas'>
			<div class='board'>
				<div class='dots'></div>
				<h2>Gutenberg Settings</h2>

				<div class='images multiple'>
					<img src='images/super-video-player/guten-videos.png' style='top: 0; left: 0;' />
					<img src='images/super-video-player/guten-options.png' style='width: 34%; left: 30.5%;' />
					<img src='images/super-video-player/guten-controls.png' style='width: 34%; top: 0; right: 0;' />
				</div>
			</div>
		</div>
	</div>

	<script src='script.js'></script>
</body>

</html>
